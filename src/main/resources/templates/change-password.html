<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Change password · TrustVault</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/theme.js}" defer></script>
</head>
<body class="login-page">
<main class="login-card">
	<a class="brand" th:href="@{/documents}"><span class="brand-mark">TV</span> TrustVault</a>
	<p class="eyebrow" style="margin-top: 28px">ACCOUNT SECURITY</p>
	<h1>Change your password</h1>
	<p class="muted">Choose a password you have not used before. Passwords must be 12–72 UTF-8 bytes.</p>
	<div class="alert success" th:if="${notice}" th:text="${notice}"></div>
	<div class="alert error" th:if="${error}" th:text="${error}"></div>
	<form method="post" th:action="@{/account/password}">
		<label for="current-password">Current password</label>
		<input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
		<label for="new-password">New password</label>
		<input id="new-password" name="newPassword" type="password" autocomplete="new-password"
				minlength="12" maxlength="72" required>
		<label for="confirm-password">Confirm new password</label>
		<input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
				minlength="12" maxlength="72" required>
		<button class="button primary full" type="submit">Update password</button>
	</form>
	<p class="login-hint"><a th:href="@{/documents}">Back to documents</a></p>
</main>
</body>
</html>
