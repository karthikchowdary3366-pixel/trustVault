<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Reset password · TrustVault</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/js/theme.js}" defer></script>
</head>
<body class="login-page">
<main class="login-card">
	<a class="brand" th:href="@{/login}"><span class="brand-mark">TV</span> TrustVault</a>
	<p class="eyebrow" style="margin-top: 28px">ACCOUNT RECOVERY</p>
	<h1>Reset your password</h1>
	<p class="muted">Request a one-time code sent to the email address on your account. The code expires in 10 minutes; five incorrect attempts invalidate it.</p>
	<div class="alert success" th:if="${resetNotice}" th:text="${resetNotice}"></div>
	<div class="alert error" th:if="${resetError}" th:text="${resetError}"></div>
	<form method="post" th:action="@{/password-reset/confirm}">
		<label for="email">Email address</label>
		<input id="email" name="email" type="email" autocomplete="email"
				th:value="${resetEmail != null ? resetEmail : email}" required>
		<button class="button primary full" type="submit" th:formaction="@{/password-reset/request}"
				formnovalidate>Send a verification code</button>
		<label for="code">Verification code</label>
		<input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
		<label for="new-password">New password</label>
		<input id="new-password" name="newPassword" type="password" autocomplete="new-password"
				minlength="12" maxlength="72" required>
		<label for="confirm-password">Confirm new password</label>
		<input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password"
				minlength="12" maxlength="72" required>
		<p class="login-hint">Use at least 12 characters and no more than 72 UTF-8 bytes.</p>
		<button class="button primary full" type="submit">Verify code and reset password</button>
	</form>
	<p class="login-hint"><a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
